name: Security scans

# Security Validation scope 13: dependency, code, secret and container image
# scanning on every push and pull request, plus a weekly run so new
# advisories against unchanged code are still caught.

on:
  push:
  pull_request:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails on any high or critical advisory in production dependencies.
  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, report only)
        run: npm audit || true

  # Static analysis of the TypeScript/JavaScript code with GitHub CodeQL.
  # Results go to the Security tab when code scanning is available for the
  # repository (public repos, or private repos with GitHub Advanced
  # Security); otherwise they are kept as a downloadable SARIF artifact.
  codeql:
    name: Code scan (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          upload: ${{ github.event.repository.private == false && 'always' || 'never' }}
          output: codeql-results
      - name: Fail on high-severity CodeQL findings
        run: |
          node -e '
            const fs = require("fs");
            const dir = "codeql-results";
            let high = 0;
            for (const file of fs.readdirSync(dir).filter((f) => f.endsWith(".sarif"))) {
              const sarif = JSON.parse(fs.readFileSync(`${dir}/${file}`, "utf8"));
              for (const run of sarif.runs ?? []) {
                const rules = new Map((run.tool?.driver?.rules ?? []).map((r) => [r.id, r]));
                for (const result of run.results ?? []) {
                  const rule = rules.get(result.ruleId);
                  const score = Number(rule?.properties?.["security-severity"] ?? 0);
                  if (score >= 7) {
                    high += 1;
                    const loc = result.locations?.[0]?.physicalLocation;
                    console.log(`::error file=${loc?.artifactLocation?.uri},line=${loc?.region?.startLine}::${result.ruleId}: ${result.message?.text}`);
                  }
                }
              }
            }
            console.log(`${high} high or critical CodeQL finding(s).`);
            process.exit(high ? 1 : 0);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 14

  # Looks for committed credentials in the whole git history.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Report findings in the job log only; never post them as comments.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # Builds the production image and scans it (OS packages, Node packages and
  # the bundled github-mcp-server / Caddy binaries), plus the Dockerfiles and
  # compose file for misconfiguration such as running as root.
  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: |
          docker build -f Dockerfile.nexus -t nexus:scan \
            --build-arg NEXT_PUBLIC_CHAT_SERVER_URL=https://example.invalid/api \
            --build-arg NEXT_PUBLIC_CHAT_SERVER_WS_URL=wss://example.invalid/api .
      - name: Check the image runs as a non-root user
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' nexus:scan)
          echo "Image user: ${user:-root}"
          case "$user" in ""|root|0|0:*) echo "::error::Dockerfile.nexus must end with a non-root USER"; exit 1;; esac
      # Trivy runs from its official image so no extra action has to be trusted.
      - name: Scan the image for fixable high and critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src \
            aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1 nexus:scan
      - name: Scan Dockerfiles for misconfiguration
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest config \
            --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 .
