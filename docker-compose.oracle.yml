services:
  postgres:
    image: &postgres_image postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multiplayer_ai}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.oracle}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-multiplayer_ai}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-off step before Nexus starts: the app now runs as the unprivileged
  # "node" user (uid 1000), so make sure Caddy's certificate volumes, which
  # earlier root-run versions created, belong to that user. It exits at once
  # when they already do.
  volume-permissions:
    image: *postgres_image
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data/caddy /config/caddy"]
    volumes:
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
    restart: "no"
    network_mode: none

  nexus:
    build:
      context: .
      dockerfile: Dockerfile.nexus
      args:
        NEXT_PUBLIC_CHAT_SERVER_URL: https://${NEXUS_DOMAIN}/api
        NEXT_PUBLIC_CHAT_SERVER_WS_URL: wss://${NEXUS_DOMAIN}/api
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_BROWSER_DSN:-}
        NEXT_PUBLIC_EMAIL_VERIFICATION_ENABLED: ${NEXT_PUBLIC_EMAIL_VERIFICATION_ENABLED:-true}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    # Runs as a non-root user with no extra Linux capabilities. Binding ports
    # 80 and 443 then needs this (namespaced) setting instead of root.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy stores its ACME account and certificates here. Keeping these
      # across image rebuilds prevents a new certificate request on every
      # deployment (and avoids Let's Encrypt rate limits).
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
    environment:
      PORT: "80"
      CADDY_CONFIG: /app/Caddyfile.oracle
      # Caddy is the one proxy in front of the chat server. Without this,
      # every request appears to come from 127.0.0.1 and per-IP sign-in,
      # reset and join-code limits are shared by all users.
      TRUST_PROXY_HOPS: "1"
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:?Set NEXUS_DOMAIN in .env.oracle}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multiplayer_ai}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env.oracle}
      WEB_APP_URL: https://${NEXUS_DOMAIN}
      CHAT_SERVER_PUBLIC_URL: https://${NEXUS_DOMAIN}/api
      NEXT_PUBLIC_CHAT_SERVER_URL: https://${NEXUS_DOMAIN}/api
      NEXT_PUBLIC_CHAT_SERVER_WS_URL: wss://${NEXUS_DOMAIN}/api
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-true}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:?Set AGENT_LLM_BASE_URL in .env.oracle}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:?Set AGENT_LLM_API_KEY in .env.oracle}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:?Set AGENT_LLM_MODEL in .env.oracle}
      AGENT_LLM_MAX_TOKENS: ${AGENT_LLM_MAX_TOKENS:-1024}
      AGENT_LLM_TPM_LIMIT: ${AGENT_LLM_TPM_LIMIT:-8192}
      AGENT_LLM_PRIMARY_BASE_URL: ${AGENT_LLM_PRIMARY_BASE_URL:-}
      AGENT_LLM_PRIMARY_API_KEY: ${AGENT_LLM_PRIMARY_API_KEY:-}
      AGENT_LLM_PRIMARY_MODEL: ${AGENT_LLM_PRIMARY_MODEL:-}
      AGENT_LLM_PRIMARY_MAX_TOKENS: ${AGENT_LLM_PRIMARY_MAX_TOKENS:-}
      AGENT_LLM_PRIMARY_TPM_LIMIT: ${AGENT_LLM_PRIMARY_TPM_LIMIT:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      SLACK_OAUTH_CLIENT_ID: ${SLACK_OAUTH_CLIENT_ID:-}
      SLACK_OAUTH_CLIENT_SECRET: ${SLACK_OAUTH_CLIENT_SECRET:-}
      LINEAR_OAUTH_CLIENT_ID: ${LINEAR_OAUTH_CLIENT_ID:-}
      LINEAR_OAUTH_CLIENT_SECRET: ${LINEAR_OAUTH_CLIENT_SECRET:-}
      NOTION_OAUTH_CLIENT_ID: ${NOTION_OAUTH_CLIENT_ID:-}
      NOTION_OAUTH_CLIENT_SECRET: ${NOTION_OAUTH_CLIENT_SECRET:-}
      FIGMA_OAUTH_CLIENT_ID: ${FIGMA_OAUTH_CLIENT_ID:-}
      FIGMA_OAUTH_CLIENT_SECRET: ${FIGMA_OAUTH_CLIENT_SECRET:-}
      FIGMA_MCP_URL: ${FIGMA_MCP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      GMAIL_SMTP_USER: ${GMAIL_SMTP_USER:-}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD:-}
      GMAIL_API_CLIENT_ID: ${GMAIL_API_CLIENT_ID:-}
      GMAIL_API_CLIENT_SECRET: ${GMAIL_API_CLIENT_SECRET:-}
      GMAIL_API_REFRESH_TOKEN: ${GMAIL_API_REFRESH_TOKEN:-}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
